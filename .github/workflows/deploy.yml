name: Deploy lên Hostinger VPS

# Chạy tự động khi push vào nhánh main, hoặc bấm chạy thủ công trong tab Actions.
# Cần khai báo trước các secret trong Settings > Secrets and variables > Actions:
#   VPS_HOST       - IP hoặc domain của VPS Hostinger
#   VPS_USER       - user SSH (thường là root hoặc user deploy riêng)
#   VPS_SSH_KEY    - private key SSH tương ứng với public key đã thêm trên VPS
#   VPS_APP_PATH   - đường dẫn thư mục chứa mã nguồn trên VPS, ví dụ /opt/vitavina-erp

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose build app
            docker compose up -d
            docker image prune -f
